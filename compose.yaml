# AI Visibility Platform — one command: `docker compose up --build`
# UI:  http://localhost:8080        API: http://localhost:8080/api (proxied) or http://localhost:5000/api
name: ai-visibility

services:
  backend:
    build:
      context: ./backend
      target: runtime
    env_file:
      - path: ./backend/.env       # your credentials (copy backend/.env.example); optional so the stack still boots
        required: false
    environment:
      DATABASE_URL: sqlite:////data/ai_visibility.db
      PORT: "5000"
    volumes:
      - backend-data:/data          # durable SQLite: run history survives restarts and rebuilds
    ports:
      - "${BACKEND_PORT:-5000}:5000"   # direct API access for debugging; the UI uses the nginx proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
